name: Publicar el sitio en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/exportar_web.py"]
  workflow_run:
    workflows: ["Scraper diario de proposiciones"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
      - name: Exportar los datos a JSON para el sitio
        run: uv run scripts/exportar_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
