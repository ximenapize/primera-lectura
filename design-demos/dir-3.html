<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primera Lectura — Dirección 3: La mesa de trabajo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--guinda:#7A1F2B;--guinda-o:#5C1420;--tinta:#1B1D21;--gris:#5E636B;--linea:#D3D6DB;--fondo:#ECEEF1;--rojo:#C2281D;--ambar:#B67B00;--verde:#27764E}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:16px/1.5 Barlow,system-ui,sans-serif;color:var(--tinta);background:var(--fondo)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2F6FB3;outline-offset:-3px}
.app{display:grid;grid-template-columns:210px 400px minmax(0,1fr);height:100vh}
.lado{background:var(--tinta);color:#fff;padding:22px 18px;display:flex;flex-direction:column;gap:22px}
.marca{font:700 26px/1 "Barlow Condensed";letter-spacing:.01em}
.marca small{display:block;font:400 14px Barlow;color:#C9CDD3;margin-top:6px}
.lado nav{display:grid;gap:2px}
.lado nav a{color:#DDE0E4;text-decoration:none;padding:11px 12px;border-radius:4px;font-weight:500}
.lado nav a[aria-current]{background:var(--guinda);color:#fff}
.lado h2{font:600 14px Barlow;color:#C9CDD3;margin:0 0 8px}
.lente{display:grid;gap:6px}
.lente button{text-align:left;background:none;border:1px solid #6A6F78;border-radius:4px;padding:9px 10px;cursor:pointer;font-size:14px;min-height:44px}
.lente button[aria-pressed=true]{background:#fff;color:var(--tinta);font-weight:600;border-color:#fff}
.lente button:disabled{border-style:dashed;color:#A9AEB6;cursor:default}
.lado .act{margin-top:auto;font-size:14px;color:#C9CDD3}
.lista{background:#fff;border-right:1px solid var(--linea);display:flex;flex-direction:column;min-height:0}
.lista header{padding:18px 18px 12px;border-bottom:1px solid var(--linea)}
.lista h1{font:700 28px/1 "Barlow Condensed";margin:0 0 4px}
.lista header p{margin:0 0 12px;color:var(--gris);font-size:14px}
.seg{display:flex;border:1px solid var(--linea);border-radius:4px;overflow:hidden}
.seg button{flex:1;background:#fff;border:0;border-right:1px solid var(--linea);min-height:40px;cursor:pointer;font-size:14px}
.seg button:last-child{border:0}
.seg button[aria-pressed=true]{background:var(--tinta);color:#fff;font-weight:600}
.filas{overflow:auto;flex:1}
.f{all:unset;box-sizing:border-box;display:grid;grid-template-columns:8px 1fr;gap:12px;width:100%;padding:14px 18px 14px 0;border-bottom:1px solid var(--linea);cursor:pointer}
.f i{background:var(--rojo)}.f.amarillo i{background:var(--ambar)}
.f:hover{background:#F6F7F9}
.f[aria-selected=true]{background:#F4E9EA}
.f b{font:600 18px/1.2 "Barlow Condensed";display:block}
.f span{font-size:14px;color:var(--gris)}
.f em{font-style:normal;font-size:15px;display:block;margin:2px 0 3px;line-height:1.35}
.rep{overflow:auto;padding:28px 36px 60px;background:var(--guinda-o)}
.hoja{background:#fff;border:1px solid var(--linea);border-top:6px solid var(--rojo);max-width:820px;margin:0 auto;padding:34px 42px 40px}
.hoja.amarillo{border-top-color:var(--ambar)}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:6px}
.top span{font-size:14px;color:var(--gris)}
.pdf{background:var(--tinta);color:#fff;border:0;border-radius:4px;padding:0 14px;min-height:44px;cursor:pointer;font-weight:600;white-space:nowrap}
.hoja h2{font:700 38px/1.05 "Barlow Condensed";margin:0 0 14px}
.estado{display:inline-block;font-weight:600;font-size:14px;padding:3px 10px;background:var(--rojo);color:#fff;border-radius:3px;margin-bottom:12px}
.amarillo .estado{background:var(--ambar)}
.oficial{font-size:14px;color:var(--gris);margin:0 0 22px;border-bottom:1px solid var(--linea);padding-bottom:18px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--tinta);margin-bottom:22px}
.tabs button{background:none;border:0;padding:0 16px;min-height:44px;cursor:pointer;font-weight:500}
.tabs button[aria-selected=true]{background:var(--tinta);color:#fff}
blockquote{margin:0 0 6px;padding:14px 18px;background:#FAF0EE;border-left:5px solid var(--rojo);font-style:italic;font-size:17px}
.amarillo blockquote{background:#FBF3DF;border-color:var(--ambar)}
.ok{font-size:14px;font-weight:600;color:var(--verde);margin:0 0 16px}
.gp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--linea);border:1px solid var(--linea);margin:18px 0}
.gp div{background:#fff;padding:14px 16px}
h3{font:600 14px Barlow;color:var(--gris);margin:0 0 4px}
.gp p{margin:0}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-size:14px;color:var(--gris);font-weight:600}
td.r{font-weight:600;white-space:nowrap}td.si{color:var(--rojo)}td.depende{color:var(--ambar)}td.no,td.no_aplica{color:var(--gris);font-weight:400}
.paso{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--linea)}
.paso span{color:var(--gris);font-size:14px}
@media (max-width:1000px){html,body{height:auto}.app{grid-template-columns:1fr;height:auto}.lado{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px}.lado nav,.lado .act,.lado h2{display:none}.lente{display:flex}.lente button:disabled{display:none}.filas{max-height:46vh}.rep{padding:16px}.hoja{padding:22px 18px}.hoja h2{font-size:30px}.gp{grid-template-columns:1fr}}
@media print{.lado,.lista,.tabs,.pdf{display:none}.app{display:block;height:auto}.rep{padding:0}.hoja{border:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="lado">
    <div class="marca">Primera Lectura<small>Seguimiento del Congreso del Perú</small></div>
    <nav aria-label="Secciones"><a href="#" aria-current="page">Alertas</a><a href="#">Todos los proyectos</a><a href="#">Votaciones</a><a href="#">Bancadas</a><a href="#">Metodología</a></nav>
    <div><h2>Lente del cliente</h2><div class="lente"><button aria-pressed="true">Derechos humanos y gobernanza</button><button disabled>Riesgo regulatorio</button><button disabled>Lente a medida</button></div></div>
    <p class="act" id="act"></p>
  </aside>
  <section class="lista">
    <header><h1>Alertas abiertas</h1><p id="cuenta"></p>
      <div class="seg" role="group" aria-label="Filtrar por color"><button data-s="" aria-pressed="true">Todas</button><button data-s="rojo" aria-pressed="false">Rojas</button><button data-s="amarillo" aria-pressed="false">En observación</button></div></header>
    <div class="filas" id="filas" role="listbox" aria-label="Proyectos con alerta"></div>
  </section>
  <main class="rep"><article class="hoja" id="hoja"></article></main>
</div>
<script src="datos.js"></script>
<script>
const D=window.D,$=s=>document.querySelector(s),T=[...D.rojos,...D.amarillos];
const orac=s=>{s=s.replace(/\.$/,'');return s[0]+s.slice(1).toLowerCase().replace(/\bperú\b/g,'Perú').replace(/constitución/g,'Constitución')};
const f=d=>new Date(d+'T12:00').toLocaleDateString('es-PE',{day:'numeric',month:'short',year:'numeric'});
const R={si:'Sí',no:'No',depende:'Depende',no_aplica:'No aplica'};
let sel=T[0].id,filtro='',tab='lectura';
function lista(){
  $('#filas').innerHTML=T.filter(a=>!filtro||a.semaforo==filtro).map(a=>`<button class="f ${a.semaforo}" role="option" aria-selected="${a.id==sel}" data-id="${a.id}"><i></i><div><b>PL ${a.pl} ${a.camara=='senado'?'Senado':'Diputados'}</b><em>${a.resumen}</em><span>${a.bancada}, ${orac(a.estado).toLowerCase()}</span></div></button>`).join('');
  document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{sel=b.dataset.id;tab='lectura';lista();hoja()});
}
function hoja(){
  const a=T.find(x=>x.id==sel),h=$('#hoja');h.className='hoja '+a.semaforo;
  const cuerpo={lectura:`${a.cita?`<blockquote>«${a.cita}»</blockquote><p class="ok">Cita verificada en el PDF del proyecto</p>`:''}<p>${a.explicacion}</p>
    <div class="gp"><div><h3>Quiénes ganan</h3><p>${a.ganan}</p></div><div><h3>Quiénes pierden</h3><p>${a.pierden}</p></div></div>
    <h3>Derechos y estándares</h3><p>${a.derechos.join('; ')}.<br>${a.estandares.join('; ')}.</p>`,
   rubrica:`<table><tr><th>Dimensión</th><th>Pregunta</th><th>Respuesta</th></tr>${D.meta.preguntas.map(p=>`<tr><td>${p.dimension}</td><td>${p.texto}${p.critica?' <b>(crítica)</b>':''}</td><td class="r ${a.preguntas[p.id]}">${R[a.preguntas[p.id]]}</td></tr>`).join('')}</table>`,
   ruta:a.recorrido.map(([d,e])=>`<div class="paso"><span>${f(d)}</span><b>${orac(e)}</b></div>`).join('')+`<p style="margin-top:16px">Comisión: ${a.comision||'por asignar'}. <a href="${a.url}">Expediente en el portal del Congreso</a></p>`}[tab];
  h.innerHTML=`<div class="top"><span>Reporte de lectura, PL ${a.pl} ${a.camara=='senado'?'Senado':'Cámara de Diputados'}, presentado el ${f(a.fecha)}</span><button class="pdf" onclick="print()">Descargar PDF</button></div>
  <span class="estado">${a.semaforo=='rojo'?'Alerta roja':'En observación'}</span><h2>${a.resumen}</h2>
  <p class="oficial">Título oficial: ${orac(a.titulo)}. Presentado por ${a.autor} (${a.bancada}).</p>
  <div class="tabs" role="tablist">${[['lectura','Lectura'],['rubrica','Rúbrica: 14 preguntas'],['ruta','Ruta del proyecto']].map(([k,t])=>`<button role="tab" aria-selected="${k==tab}" data-t="${k}">${t}</button>`).join('')}</div>${cuerpo}`;
  h.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;hoja()});
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{filtro=b.dataset.s;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x==b));lista()});
$('#cuenta').textContent=`${D.conteo.rojo} rojas y ${D.conteo.amarillo} en observación entre ${D.meta.lecturas} proyectos leídos`;
$('#act').textContent=`Actualizado el ${f(D.meta.actualizado)}. ${D.meta.n} proyectos en seguimiento.`;
lista();hoja();
</script>
</body>
</html>
