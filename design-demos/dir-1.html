<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primera Lectura — Dirección 1: El informe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{--azul:#0E2A47;--tinta:#14202E;--gris:#55616F;--linea:#D5DAE0;--fondo:#F3F5F7;--rojo:#B3261E;--ambar:#8A5A00;--verde:#1E6B45;--rojo-f:#FBEAE8;--ambar-f:#FBF1DC}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 Archivo,system-ui,sans-serif;color:var(--tinta);background:var(--fondo)}
button,select{font:inherit;color:inherit}
a{color:var(--azul)}
:focus-visible{outline:3px solid #2F6FB3;outline-offset:2px}
.barra{background:var(--azul);color:#fff;display:flex;align-items:center;gap:28px;padding:0 32px;min-height:60px;flex-wrap:wrap}
.marca{font-weight:700;font-stretch:112%;font-size:18px;display:flex;align-items:center;gap:10px}
.marca svg{width:26px;height:16px}
.barra nav{display:flex;gap:4px;flex:1}
.barra nav a{color:#C9D5E2;text-decoration:none;padding:19px 12px;font-size:15px;border-bottom:3px solid transparent}
.barra nav a[aria-current]{color:#fff;border-color:#fff}
.barra select{background:#173A5E;color:#fff;border:1px solid #47678A;border-radius:4px;padding:8px 10px;font-size:14px;min-height:44px}
.pdf{background:#fff;color:var(--azul);border:0;border-radius:4px;padding:0 16px;min-height:44px;font-weight:600;cursor:pointer}
.mesa{display:grid;grid-template-columns:230px minmax(0,820px);gap:40px;max-width:1150px;margin:0 auto;padding:36px 32px 80px}
.indice{position:sticky;top:24px;align-self:start;font-size:14px}
.indice p{margin:0 0 10px;color:var(--gris)}
.indice ol{list-style:none;margin:0 0 24px;padding:0;border-left:2px solid var(--linea)}
.indice li a{display:block;padding:9px 14px;color:var(--tinta);text-decoration:none;margin-left:-2px;border-left:2px solid transparent}
.indice li a:hover{border-color:var(--azul);background:#fff}
.indice dl{margin:0;display:grid;gap:10px}
.indice dt{color:var(--gris);font-size:14px}.indice dd{margin:0;font-weight:600}
.hoja{background:#fff;border:1px solid var(--linea);padding:56px 64px 64px;box-shadow:0 1px 0 #C3CAD2}
.membrete{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--azul);padding-bottom:18px;margin-bottom:28px;gap:20px}
h1{font-size:46px;line-height:1.02;font-stretch:118%;font-weight:700;margin:0;color:var(--azul);letter-spacing:-.01em}
.numero{text-align:right;font-size:14px;color:var(--gris)}
.numero b{display:block;font-size:22px;color:var(--tinta)}
.sintesis{font:22px/1.45 "Source Serif 4",serif;margin:0 0 28px;max-width:34em}
.sintesis b{font-weight:600}
.cifras{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);margin-bottom:44px}
.cifras div{padding:16px 16px 16px 0}.cifras div+div{border-left:1px solid var(--linea);padding-left:16px}
.cifras b{display:block;font-size:30px;font-stretch:112%;line-height:1.1}
.cifras span{font-size:14px;color:var(--gris)}
h2{font-size:22px;font-stretch:112%;margin:0 0 4px;color:var(--azul);display:flex;gap:12px}
h2 i{font-style:normal;min-width:1.2em}
.sec{margin-bottom:48px;scroll-margin-top:20px}
.sec>p.nota{color:var(--gris);margin:0 0 18px 34px;font-size:15px}
.alerta{border-top:1px solid var(--linea)}
.alerta>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:92px 1fr 28px;gap:16px;width:100%;padding:18px 0;cursor:pointer;align-items:start}
.alerta>button:hover .res{text-decoration:underline}
.pl{font-weight:700;font-size:15px}
.pl small{display:block;font-weight:400;color:var(--gris);font-size:14px}
.res{font:19px/1.4 "Source Serif 4",serif;font-weight:600}
.meta{font-size:14px;color:var(--gris);margin-top:4px}
.mas{font-size:22px;color:var(--azul);text-align:center;transition:transform .2s}
.alerta[open] .mas{transform:rotate(45deg)}
.sello{display:inline-block;font-size:14px;font-weight:700;padding:2px 8px;border-radius:3px;margin-bottom:6px}
.sello.rojo{background:var(--rojo);color:#fff}.sello.amarillo{background:var(--ambar-f);color:var(--ambar);border:1px solid #E3C784}
.ficha{display:none;padding:0 0 26px 108px}
.alerta[open] .ficha{display:block}
blockquote{margin:0 0 6px;padding:12px 16px;background:var(--rojo-f);border-left:4px solid var(--rojo);font:italic 17px/1.5 "Source Serif 4",serif}
.amarillo blockquote{background:var(--ambar-f);border-color:#C99A2E}
.ok{font-size:14px;color:var(--verde);font-weight:600;margin:0 0 16px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:18px 0}
.dos h3,.ficha h3{font-size:14px;margin:0 0 4px;color:var(--gris);font-weight:600}
.dos p{margin:0}
.preg{list-style:none;margin:0 0 16px;padding:0}
.preg li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--linea);font-size:15px}
.preg b.si{color:var(--rojo)}.preg b.depende{color:var(--ambar)}
.ruta{display:flex;gap:4px;margin:6px 0 16px}
.ruta span{flex:1;font-size:12px;padding-top:8px;border-top:5px solid var(--linea);color:var(--gris)}
.ruta span.hecho{border-color:var(--azul);color:var(--tinta);font-weight:600}
.fila{display:grid;grid-template-columns:190px 1fr 86px;gap:14px;align-items:center;padding:7px 0;font-size:15px;margin-left:34px}
.pila{display:flex;height:18px;background:var(--fondo)}
.pila i{display:block}.si-b{background:var(--azul)}.no-b{background:var(--rojo)}.ab-b{background:#C99A2E}.au-b{background:#C3CAD2}
.fila span:last-child{text-align:right;color:var(--gris);font-variant-numeric:tabular-nums;font-size:14px}
.ley{display:flex;gap:18px;font-size:14px;color:var(--gris);margin:12px 0 0 34px;flex-wrap:wrap}
.ley i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.pie{font-size:14px;color:var(--gris);border-top:1px solid var(--linea);padding-top:16px}
@media (max-width:900px){.mesa{grid-template-columns:1fr;padding:16px}.indice{position:static}.indice dl{display:none}.hoja{padding:28px 20px}h1{font-size:34px}.membrete{display:block}.numero{text-align:left;margin-top:12px}.barra{padding:8px 16px;gap:10px}.sintesis{font-size:19px}.cifras{grid-template-columns:1fr 1fr}.ficha{padding-left:0}.alerta>button{grid-template-columns:70px 1fr 24px}.fila{grid-template-columns:1fr;gap:4px;margin-left:0}.fila span:last-child{text-align:left}.dos{grid-template-columns:1fr}.barra nav{order:3;flex-basis:100%;overflow:auto}.sec>p.nota,.ley{margin-left:0}}
@media print{.barra,.indice{display:none}body{background:#fff}.mesa{display:block;padding:0}.hoja{border:0;box-shadow:none;padding:0}.ficha{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="barra">
  <div class="marca"><svg viewBox="0 0 26 16" aria-hidden="true"><path d="M1 15a12 12 0 0 1 24 0" fill="none" stroke="#fff" stroke-width="2"/><path d="M6 15a7 7 0 0 1 14 0" fill="none" stroke="#fff" stroke-width="2"/><circle cx="13" cy="14" r="2" fill="#fff"/></svg>Primera Lectura</div>
  <nav aria-label="Secciones"><a href="#" aria-current="page">Reporte</a><a href="#">Proyectos</a><a href="#">Votaciones</a><a href="#">Metodología</a></nav>
  <label><span style="font-size:14px;color:#C9D5E2;margin-right:8px">Lente</span><select aria-label="Lente temático"><option>Derechos humanos y gobernanza</option><option disabled>Riesgo regulatorio (a pedido)</option><option disabled>Salud (a pedido)</option></select></label>
  <button class="pdf" onclick="print()">Descargar PDF</button>
</header>
<div class="mesa">
  <aside class="indice">
    <p>En este reporte</p>
    <ol><li><a href="#s1">1. Alertas rojas abiertas</a></li><li><a href="#s2">2. En observación</a></li><li><a href="#s3">3. Votación destacada</a></li><li><a href="#s4">4. Qué ingresó esta semana</a></li><li><a href="#s5">5. Cómo se hizo</a></li></ol>
    <dl id="datos"></dl>
  </aside>
  <main class="hoja" id="hoja"></main>
</div>
<script src="datos.js"></script>
<script>
const D=window.D, $=s=>document.querySelector(s);
const orac=s=>{s=s.replace(/\.$/,'');return s[0]+s.slice(1).toLowerCase().replace(/\bperú\b/g,'Perú').replace(/constitución/g,'Constitución')};
const f=d=>new Date(d+'T12:00').toLocaleDateString('es-PE',{day:'numeric',month:'long'});
const hasta=D.meta.actualizado, desde=new Date(new Date(hasta+'T12:00')-6*864e5).toISOString().slice(0,10);
const PASOS=['Presentado','Comisión','Dictamen','Pleno','Aprobado'];
const PQ=Object.fromEntries(D.meta.preguntas.map(p=>[p.id,p]));
function ficha(a){
  const act=Object.entries(a.preguntas).filter(([,v])=>v=='si'||v=='depende');
  return `<div class="ficha ${a.semaforo}">
    ${a.cita?`<blockquote>«${a.cita}»</blockquote><p class="ok">${a.cita_ok?'Cita verificada en el PDF del proyecto':'Cita sin verificar'}</p>`:''}
    <p>${a.explicacion}</p>
    <div class="dos"><div><h3>Quiénes ganan</h3><p>${a.ganan}</p></div><div><h3>Quiénes pierden</h3><p>${a.pierden}</p></div></div>
    <h3>Preguntas de la rúbrica activadas: ${act.length} de 14</h3>
    <ul class="preg">${act.map(([k,v])=>`<li><b class="${v}">${v=='si'?'Sí':'Depende'}${PQ[k].critica?' · crítica':''}</b><span>${PQ[k].texto}</span></li>`).join('')}</ul>
    <h3>Estándares</h3><p style="margin:0 0 16px">${a.estandares.join('; ')}</p>
    <h3>Ruta del proyecto</h3><div class="ruta">${PASOS.map((p,i)=>`<span class="${i<a.avance?'hecho':''}">${p}</span>`).join('')}</div>
    <a href="${a.url}">Ver expediente en el portal del Congreso</a></div>`;
}
const fila=a=>`<div class="alerta ${a.semaforo}"><button aria-expanded="false">
  <div class="pl">PL ${a.pl}<small>${a.camara=='senado'?'Senado':'Diputados'}</small></div>
  <div><span class="sello ${a.semaforo}">${a.semaforo=='rojo'?'Alerta roja':'En observación'}</span><div class="res">${a.resumen}</div>
  <div class="meta">${a.bancada} — ${a.autor} — ${orac(a.estado)}</div></div><div class="mas" aria-hidden="true">+</div></button>${ficha(a)}</div>`;
const v=D.votacion, porB={};
v.votos.forEach(([n,b,c])=>{const o=porB[b]??={SI:0,NO:0,AB:0,AU:0};o[c=='SI'?'SI':c=='NO'?'NO':c.startsWith('Abst')?'AB':'AU']++});
const filasB=Object.entries(porB).sort((a,b)=>(b[1].SI+b[1].NO)-(a[1].SI+a[1].NO)).map(([b,o])=>{const t=o.SI+o.NO+o.AB+o.AU;
  return `<div class="fila"><span>${D.meta.bancadas[b]||b}</span><div class="pila" role="img" aria-label="${o.SI} a favor, ${o.NO} en contra">
  <i class="si-b" style="width:${o.SI/t*100}%"></i><i class="no-b" style="width:${o.NO/t*100}%"></i><i class="ab-b" style="width:${o.AB/t*100}%"></i><i class="au-b" style="width:${o.AU/t*100}%"></i></div><span>${o.SI} – ${o.NO}</span></div>`}).join('');
const maxT=D.temas[0][1];
$('#hoja').innerHTML=`
<div class="membrete"><h1>Reporte<br>legislativo</h1><div class="numero">Semana del<b>${f(desde)} al ${f(hasta)}</b>Congreso del Perú, periodo 2026–2031</div></div>
<p class="sintesis">Esta semana ingresaron <b>${D.meta.semana} proyectos de ley</b>. Ninguno activó una alerta roja y 3 quedaron en observación. Siguen abiertas <b>${D.conteo.rojo} alertas rojas</b> del periodo, todas todavía en comisión: la mitad amplía la detención policial sin control judicial.</p>
<div class="cifras"><div><b>${D.meta.n}</b><span>proyectos en seguimiento</span></div><div><b>${D.meta.lecturas}</b><span>leídos con la rúbrica</span></div><div><b style="color:var(--rojo)">${D.conteo.rojo}</b><span>alertas rojas</span></div><div><b style="color:var(--ambar)">${D.conteo.amarillo}</b><span>en observación</span></div></div>
<section class="sec" id="s1"><h2><i>1</i>Alertas rojas abiertas</h2><p class="nota">Al menos una pregunta crítica de la rúbrica respondida «sí». Abre cada una para ver la cita y el sustento.</p>${D.rojos.map(fila).join('')}</section>
<section class="sec" id="s2"><h2><i>2</i>En observación</h2><p class="nota">El efecto depende de cómo se implemente. Se muestran 6 de ${D.conteo.amarillo}.</p>${D.amarillos.map(fila).join('')}</section>
<section class="sec" id="s3"><h2><i>3</i>Votación destacada</h2><p class="nota">PL ${+v.pls[0].slice(0,5)}, delegación de facultades al Ejecutivo en seguridad ciudadana. ${f(v.fecha)}: <b>${v.resultado.toLowerCase()}</b>, ${v.si} a favor y ${v.no} en contra.</p>${filasB}
<div class="ley"><span><i class="si-b"></i>A favor</span><span><i class="no-b"></i>En contra</span><span><i class="ab-b"></i>Abstención</span><span><i class="au-b"></i>Ausente</span></div></section>
<section class="sec" id="s4"><h2><i>4</i>Qué ingresó esta semana</h2><p class="nota">Los ${D.meta.semana} proyectos nuevos, por temática.</p>${D.temas.map(([t,n])=>`<div class="fila"><span>${t}</span><div class="pila"><i class="si-b" style="width:${n/maxT*100}%"></i></div><span>${n}</span></div>`).join('')}</section>
<section class="sec" id="s5"><h2><i>5</i>Cómo se hizo</h2><p class="nota" style="color:var(--tinta)">Cada día se descargan los expedientes del portal del Congreso. Un modelo local filtra los proyectos sensibles y un segundo lector responde las 14 preguntas de una rúbrica pública; el color sale de una regla fija, no de la opinión del modelo. Toda cita se comprueba contra el PDF original.</p></section>
<p class="pie">Alerta temprana para priorizar el trabajo. No es una opinión legal. Fuente: portal de proyectos de ley del Congreso de la República.</p>`;
$('#datos').innerHTML=`<div><dt>Actualizado</dt><dd>${f(hasta)} de 2026</dd></div><div><dt>Cámaras</dt><dd>Diputados y Senado</dd></div><div><dt>Lente</dt><dd>Derechos humanos y gobernanza</dd></div>`;
document.querySelectorAll('.alerta>button').forEach(b=>b.onclick=()=>{const a=b.parentElement;a.toggleAttribute('open');b.setAttribute('aria-expanded',a.hasAttribute('open'))});
</script>
</body>
</html>
