<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A. Mesa de datos</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--tinta:#1A1D23;--gris:#5B6270;--linea:#E4E6EA;--suave:#F5F6F8;--alerta:#B4001E}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--tinta);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif}
a{color:inherit}
header{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;border-bottom:1px solid var(--linea)}
.marca{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;letter-spacing:-.01em}
.marca svg{width:30px}
nav{display:flex;gap:28px;font-weight:500;color:var(--gris)}nav b{color:var(--tinta);box-shadow:inset 0 -3px 0 var(--tinta);padding-bottom:20px;margin-bottom:-21px}
.portada{display:grid;grid-template-columns:1fr 1.15fr;gap:48px;padding:40px 40px 28px;align-items:center;border-bottom:1px solid var(--linea)}
.portada h1{font-size:46px;line-height:1.02;letter-spacing:-.025em;font-weight:800;margin:0 0 14px}
.portada p{color:var(--gris);font-size:18px;margin:0 0 22px;max-width:30em}
.forma{display:flex;gap:22px;font-size:14px;color:var(--gris);margin-top:6px}
.forma span{display:inline-flex;gap:7px;align-items:center}
.forma i{width:13px;height:13px;border-radius:50%;display:inline-block;background:var(--tinta)}
.forma i.no{background:#fff;border:3px solid var(--tinta)}.forma i.ab{opacity:.3}.forma i.au{width:6px;height:6px;background:#A3A9B3}
.hemi{width:100%;display:block}
.composicion{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:10px}
.composicion div{border-top:5px solid;padding-top:6px;font-size:13px;color:var(--gris);line-height:1.3}
.composicion b{display:block;font-size:24px;color:var(--tinta);font-weight:800}
.cuerpo{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;padding:28px 40px 60px}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--gris);font-size:14px;margin:0 0 14px}
.alerta{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:16px 0;border-top:1px solid var(--linea)}
.alerta h3{margin:0;font-size:18px;line-height:1.3;font-weight:700}
.etiq{font-weight:700;font-size:13px;color:var(--alerta);display:inline-flex;gap:6px;align-items:center}
.etiq::before{content:"";width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--alerta)}
.meta{font-size:14px;color:var(--gris);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600;color:var(--tinta)}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block}
.lado{background:var(--suave);padding:20px 22px;border-radius:4px}
.ag{padding:12px 0;border-top:1px solid var(--linea)}.ag h3{font-size:15px;margin:0 0 4px;line-height:1.35;font-weight:600}
.sem{font-size:12px;font-weight:700;color:var(--gris)}.sem.rojo{color:var(--alerta)}.sem.amarillo{color:#8A5A00}
.boton{display:inline-block;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:4px;font-weight:700;text-decoration:none}
</style></head><body>
<header><div class="marca"><svg viewBox="0 0 40 40"><g fill="none" stroke="#1A1D23" stroke-width="3.4" stroke-linecap="round"><path d="M5 29a15 15 0 0 1 30 0"/><path d="M12.5 29a7.5 7.5 0 0 1 15 0"/></g><circle cx="20" cy="29" r="3.2" fill="#F28C00"/></svg>Primera Lectura</div>
<nav><span>Inicio</span><b>Reporte</b><span>Proyectos</span><span>Votaciones</span><span>Panorama</span><span>Cómo funciona</span></nav></header>
<section class="portada">
  <div><h1 id="t"></h1><p id="s"></p>
  <div class="forma"><span><i></i>A favor</span><span><i class="no"></i>En contra</span><span><i class="ab"></i>Abstención</span><span><i class="au"></i>Sin voto</span></div>
  <p style="margin-top:22px;font-size:14px">El color es la bancada; la forma, el voto.</p></div>
  <div><div id="h"></div><div class="composicion" id="c"></div></div>
</section>
<section class="cuerpo">
  <div><h2 id="tr"></h2><p class="sub">Leídas con el lente de derechos humanos y gobernanza. Cada cita está verificada en el PDF.</p><div id="r"></div></div>
  <aside class="lado"><h2>En la agenda del Pleno</h2><p class="sub" id="sa"></p><div id="a"></div><p style="margin-top:18px"><a class="boton" href="#">Descargar el reporte en PDF</a></p></aside>
</section>
<script src="datos.js"></script><script src="hemi.js"></script>
<script>
const v=D.voto;
t.textContent=`Diputados rechazó la delegación de facultades al Ejecutivo por ${v.no} votos contra ${v.si}`;
s.textContent=`Votación del ${fechaL(v.fecha)}. Pasa el cursor sobre un punto para ver a cada congresista.`;
h.innerHTML=hemi(v);
c.innerHTML=escanos().map(([b,n])=>`<div style="border-color:${COLOR[b]}"><b>${n}</b>${D.bancadas[b]}</div>`).join("");
tr.textContent=`${D.rojas.length} alertas rojas siguen vivas`;
r.innerHTML=D.rojas.slice(0,4).map(p=>`<article class="alerta"><div><span class="etiq">Alerta roja</span><h3>${p.resumen}</h3>
 <div class="meta">${chip(p.bancada)}<span>PL ${p.pl}, Diputados</span><span>En comisión</span></div></div></article>`).join("");
sa.textContent=`${D.n_agenda} proyectos ya tienen fecha para votarse.`;
const S={rojo:"Alerta roja",amarillo:"En observación",verde:"Sin riesgo relevante",sin:"Sin leer"};
a.innerHTML=D.agenda.slice(0,5).map(p=>`<div class="ag"><span class="sem ${p.sem}">${S[p.sem]}</span><h3>${p.resumen}</h3>${chip(p.bancada)}</div>`).join("");
</script></body></html>
